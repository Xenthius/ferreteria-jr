function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const d=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length&&first.indexOf(';')>-1?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else if(c==='"') q=true;
    else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur);cur='';rows.push(row);row=[] }
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
const ALIAS={
  sku:['codigo','sku','cod','code'],name:['nombre','producto','descripcion','articulo','detalle'],
  cat:['categoria','rubro','familia'],sup:['proveedor','provedor'],brand:['marca'],loc:['ubicacion','estante','lugar'],
  unit:['unidad','um','unidad de medida'],stock:['stock','cantidad','existencia','stock actual'],
  min:['minimo','stock minimo','min'],ideal:['ideal','stock ideal','objetivo','maximo'],
  cost:['costo','precio de costo','costo unitario'],price:['precio','precio de venta','pvp','venta'],active:['activo','estado'],
  pack:['unidades por caja','unidades x caja','unid por caja','contenido','cantidad por caja','x caja','pack'],loose:['precio unidad','precio por unidad','precio suelto','precio unidad suelta','precio x unidad']
};
let BATCH=null;   // altas de categorías/proveedores que se guardan juntas al importar
function getOrCreateCat(n){
  n=(n||'').trim();if(!n)return '';
  let c=S.categories.find(x=>norm(x.name)===norm(n));
  if(!c){c={id:uid(),name:n};S.categories.push(c);if(BATCH)BATCH.cats.push(c)}return c.id;
}
function getOrCreateSup(n){
  n=(n||'').trim();if(!n)return '';
  let s=S.suppliers.find(x=>norm(x.name)===norm(n));
  if(!s){s={id:uid(),name:n,phone:'',url:'',notes:''};S.suppliers.push(s);if(BATCH)BATCH.sups.push(s)}return s.id;
}
async function importCSV(text){
  const rows=parseCSV(text);
  if(rows.length<2){toast('El archivo no tiene datos','err');return}
  const H=rows[0].map(norm),ix={};
  Object.keys(ALIAS).forEach(k=>{ix[k]=H.findIndex(h=>ALIAS[k].indexOf(h)>-1)});
  if(ix.name<0){toast('No encontré la columna “nombre” en la primera fila','err');return}
  const B=BATCH={cats:[],sups:[],news:[],upd:{},adj:[]};
  let created=0,updated=0,skipped=0;
  const g=(r,k)=>ix[k]>-1?String(r[ix[k]]==null?'':r[ix[k]]).trim():'';
  const NF=detectNumFormat([].concat(...rows.slice(1).map(r=>['stock','min','ideal','cost','price','pack','loose'].map(k=>g(r,k)))));
  const nn=v=>num(v,NF);
  const badNums=[];
  rows.slice(1).forEach(r=>{
    const name=g(r,'name');if(!name){skipped++;return}
    const sku=g(r,'sku');
    let p=sku?S.products.find(x=>x.sku&&x.sku.toLowerCase()===sku.toLowerCase()):null;
    const isNew=!p;
    if(isNew){p={id:uid(),sku:sku,stock:0,min:0,ideal:0,cost:0,price:0,unit:'unidad',active:true,createdAt:new Date().toISOString(),priceHistory:[]};S.products.push(p);B.news.push(p)}
    else if(B.news.indexOf(p)<0)B.upd[p.id]=p;
    const fresh=B.news.indexOf(p)>-1;
    p.name=name;
    if(ix.cat>-1)p.categoryId=getOrCreateCat(g(r,'cat'));
    if(ix.sup>-1)p.supplierId=getOrCreateSup(g(r,'sup'));
    if(ix.brand>-1)p.brand=g(r,'brand');
    if(ix.loc>-1)p.location=g(r,'loc');
    if(ix.unit>-1&&g(r,'unit'))p.unit=g(r,'unit').toLowerCase();
    if(ix.min>-1)p.min=nn(g(r,'min'));
    if(ix.ideal>-1)p.ideal=nn(g(r,'ideal'));
    if(ix.cost>-1||ix.price>-1)['cost','price','stock'].forEach(k=>{const v=g(r,k);if(v!==''&&isNaN(parseNum(v,NF)))badNums.push(name)});
    if(ix.pack>-1&&g(r,'pack')!==''){const k=nn(g(r,'pack'));p.packQty=k>0?k:1}
    if(ix.loose>-1)p.loosePrice=g(r,'loose')!==''?round2(nn(g(r,'loose'))):null;
    setPrices(p,ix.cost>-1?nn(g(r,'cost')):(p.cost||0),ix.price>-1?nn(g(r,'price')):(p.price||0),isNew?'Alta (importación)':'Importación');
    if(ix.active>-1&&g(r,'active')){const a=norm(g(r,'active'));p.active=!(a==='no'||a==='inactivo'||a==='0'||a==='false')}
    if(ix.stock>-1&&g(r,'stock')!==''){
      const ns=Math.max(0,nn(g(r,'stock')));
      if(fresh)p.stock=ns;
      else if(ns!==p.stock)B.adj.push({id:p.id,ns});
    }
    isNew?created++:updated++;
  });
  BATCH=null;
  if(badNums.length&&!confirm('Hay '+badNums.length+' fila(s) con números que no se entienden (por ejemplo “'+badNums[0]+'”). Esos valores quedan en 0. ¿Importar igual?')){await safeReload(['categories','suppliers','products']);render();return}
  toast('Importando… un momento'+(NF==='ar'?' (números con coma decimal)':NF==='us'?' (números con punto decimal)':''));
  const res=await attempt(async()=>{
    await writeRows('categories',B.cats.map(c=>({id:c.id,name:c.name})),'upsert');
    await writeRows('suppliers',B.sups.map(s=>({id:s.id,name:s.name,phone:s.phone,url:s.url,notes:s.notes})),'upsert');
    await insertNewProducts(B.news,'Stock inicial (importación)');
    const upd=Object.keys(B.upd).map(k=>B.upd[k]);
    await writeRows('products',upd.map(p=>prodRow(p,false)),'upsert');
    for(const a of B.adj){
      const r=await sb.rpc('apply_movement',{p_product:a.id,p_type:'adjust',p_qty:a.ns,p_reason:'Ajuste por importación',p_note:''});
      if(r.error)throw r.error;
    }
  },'Hay códigos repetidos en el archivo o ya usados por otro producto.');
  await safeReload(['categories','suppliers','products','stock_movements']);
  render();
  if(!res.ok)return;
  toast('Importación lista: '+created+' nuevos, '+updated+' actualizados'+(skipped?', '+skipped+' omitidos':''));
}
async function exportJSON(){
  const stamp=ymd(new Date());
  const slug=norm(storeName()).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'ferreteria';
  download('respaldo-'+slug+'-'+stamp+'.json',JSON.stringify(Object.assign({exportedAt:new Date().toISOString(),store:{id:STORE,name:storeName()}},S)),'application/json');
  // deja registrado cuándo fue la última copia (para el recordatorio al salir)
  try{
    const r=await sbClient().rpc('mark_backup');
    const s=STORES.find(x=>x.id===STORE);if(s&&!r.error)s.lastBackup=r.data||new Date().toISOString();
  }catch(e){}
  toast('Copia descargada. Guardala en Google Drive.');
}


async function applySeed(){
  const existing=new Set(S.products.map(p=>norm(p.name)));
  const B=BATCH={cats:[],sups:[],news:[]};
  const now=new Date().toISOString();
  let skipped=0;
  SEED.forEach(d=>{
    if(existing.has(norm(d[0]))){skipped++;return}
    const p={id:uid(),sku:'',name:d[0],categoryId:getOrCreateCat(d[1]),brand:'',unit:'unidad',stock:Math.max(0,d[4]||0),min:0,ideal:0,cost:0,price:0,location:'',supplierId:'',buyUrl:'',notes:'',review:d[5]||'',active:true,createdAt:now,priceHistory:[]};
    setPrices(p,d[2],d[3],'Alta (Excel del local)');
    B.news.push(p);
  });
  BATCH=null;
  const r=await attempt(async()=>{
    await writeRows('categories',B.cats.map(c=>({id:c.id,name:c.name})),'upsert');
    await insertNewProducts(B.news,'Stock inicial (Excel del local)');
  });
  await safeReload(['categories','products','stock_movements']);
  return r.ok?{added:B.news.length,skipped}:null;
}
async function seedFromUI(){
  if(S.products.length&&!confirm('Se van a agregar los '+SEED.length+' productos del Excel a los '+S.products.length+' que ya hay. Los que tengan el mismo nombre se saltean. ¿Continuar?'))return;
  toast('Cargando el inventario… puede tardar unos segundos');
  const r=await applySeed();
  if(!r)return;
  ui.tab='panel';render();
  toast(r.added+' productos cargados'+(r.skipped?' ('+r.skipped+' ya estaban)':''));
}

/* ================= Eventos ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.getAttribute('data-act'),id=t.getAttribute('data-id');
  if(ACT_PERM[a]&&!can(ACT_PERM[a])){toast('Tu rol en esta ferretería ('+(ROLES[curRole()]||'sin acceso')+') no permite hacer esto','err');return}
  if(a==='overlay'){ if(e.target===t&&!$('#pos'))closeModal(); return }
  switch(a){
    case 'menu': document.body.classList.toggle('navopen');break;
    case 'nav': ui.tab=t.getAttribute('data-tab');document.body.classList.remove('navopen');closeModal();render();window.scrollTo(0,0);if(ui.tab==='usuarios')loadAdmin();break;
    case 'team-add': teamAddModal();break;
    case 'team-role': teamRoleModal(id);break;
    case 'team-del': teamDel(id);break;
    case 'backup-exit': backupAndExit();break;
    case 'exit-now': closeModal();doLogout();break;
    case 'store-hide': hideStore();break;
    case 'pg': ui.page=parseInt(t.getAttribute('data-p'),10)||1;renderInvRows();{const b=$('#invBox');if(b&&b.scrollIntoView)b.scrollIntoView({block:'start'})}break;
    case 'hist': openHistory(id);break;
    case 'store-show': showStore(id);break;
    case 'store-show-all': showAllStores();break;
    case 'store-unhide': unhideModal();break;
    case 'store-new': storeNewModal();break;
    case 'store-rename': storeRenameModal(id);break;
    case 'store-del': storeDelModal(id);break;
    case 'user-new': userNewModal();break;
    case 'user-access': userAccessModal(id);break;
    case 'user-pass': userPassModal(id);break;
    case 'user-del': userDel(id);break;
    case 'close': closeModal();break;
    case 'new-product': newProduct();break;
    case 'edit-product': closeModal();editProduct(id);break;
    case 'del-product': delProduct(id);break;
    case 'ficha': openFicha(id);break;
    case 'move': closeModal();moveModal(id,t.getAttribute('data-type'),t.getAttribute('data-qty')||'');break;
    case 'prices': pricesModal();break;
    case 'cat-add': catModal(null);break;
    case 'cat-edit': catModal(S.categories.find(c=>c.id===id));break;
    case 'cat-del': catDel(id);break;
    case 'sup-add': supModal(null);break;
    case 'sup-edit': supModal(supObj(id));break;
    case 'sup-del': supDel(id);break;
    case 'pm-add': pmModal(null);break;
    case 'pm-edit': pmModal(pmObj(id));break;
    case 'pm-del': pmDel(id);break;
    case 'new-sale': document.body.classList.remove('navopen');closeModal();startSale();break;
    case 'view-sale': viewSaleModal(id);break;
    case 'void-sale': voidSale(id);break;
    case 'copy-sale': {const s=S.sales.find(x=>x.id===id);if(s)copyText(saleText(s));break}
    case 'caja-open': cajaOpenModal(null);break;
    case 'caja-close': cajaCloseModal();break;
    case 'caja-move': cajaMoveModal(t.getAttribute('data-type'));break;
    case 'settle': settleModal(id);break;
    case 'settle-bulk': settleBulk();break;
    case 'sel-all': {const on=t.checked;$$('[data-sel]').forEach(c=>{c.checked=on;ui.sel[c.getAttribute('data-sel')]=on});return}
    case 'pos-add': posAdd(id,t.getAttribute('data-loose')==='1');break;
    case 'pos-rm': cart.items.splice(parseInt(t.getAttribute('data-i'),10),1);renderCart();updateTotals();break;
    case 'pos-pct': {const tt=cartTotals();cart.discount=round2(tt.sub*num(t.getAttribute('data-p'))/100);$('#posDisc').value=cart.discount||'';updateTotals();break}
    case 'pos-addpay': {const tt=cartTotals();const paid=cart.pay.reduce((x,p)=>x+(p.amount||0),0);cart.pay.forEach(p=>p.auto=false);const nm=S.payMethods.find(m=>m.active!==false&&m.id!==cart.pay[0].mid);cart.pay.push({mid:nm?nm.id:defaultMethod(),amount:Math.max(0,round2(tt.total-paid)),auto:false,received:''});renderPay();updatePayStatus();break}
    case 'pos-rmpay': cart.pay.splice(parseInt(t.getAttribute('data-i'),10),1);if(cart.pay.length===1)cart.pay[0].auto=true;renderPay();updateTotals();break;
    case 'pos-confirm': posConfirm();break;
    case 'pos-cancel': if(!cart||!cart.items.length||confirm('¿Cancelar la venta en curso?')){cart=null;closeModal()}break;
    case 'copy-order': {
      const k=t.getAttribute('data-k');
      const list=needs().filter(p=>k==='_'?!(p.supplierId&&supObj(p.supplierId)):p.supplierId===k);
      copyText(orderText(list,k==='_'?null:supObj(k)));break}
    case 'print': window.print();break;
    case 'export-json': exportJSON();break;
    case 'export-csv': exportCSV();break;
    case 'import-csv': $('#fileCsv').click();break;
    case 'template-csv': templateCSV();break;
    case 'seed': seedFromUI();break;
    case 'go-review': ui.tab='inventario';ui.st='review';ui.q='';ui.cat='';ui.sup='';render();window.scrollTo(0,0);break;
    case 'logout': logout();break;
    case 'retry': if(USER)enter(USER);break;
  }
});
function readFile(input,cb){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>cb(String(r.result));r.readAsText(f,'utf-8');input.value='';
}
$('#fileCsv').addEventListener('change',function(){readFile(this,importCSV)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='fq'){ui.q=t.value;ui.page=1;renderInvRows()}
  else if(t.id==='mq'){ui.mq=t.value;renderMovRows()}
  else if(t.id==='vq'){ui.vq=t.value;renderSalesRows()}
  else if(t.id==='posq'){renderRes()}
  else if(t.getAttribute&&t.getAttribute('data-pos')&&t.getAttribute('data-pos')!=='paymethod'){posInput(t)}
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;
  if(id==='storeSel'){if(t.value==='__new'){renderStoreSel();storeNewModal()}else switchStore(t.value)}
  else if(id==='pgsize'){ui.pageSize=parseInt(t.value,10)||0;ui.page=1;lsSet('inv-por-pagina',String(ui.pageSize));renderInvRows();const b=$('#invBox');if(b&&b.scrollIntoView)b.scrollIntoView({block:'start'})}
  else if(id==='fcat'){ui.cat=t.value;ui.page=1;renderInvRows()}
  else if(id==='fsup'){ui.sup=t.value;ui.page=1;renderInvRows()}
  else if(id==='fst'){ui.st=t.value;ui.page=1;renderInvRows()}
  else if(id==='fsort'){ui.sort=t.value;ui.page=1;renderInvRows()}
  else if(id==='mtype'){renderMovRows()}
  else if(id==='vp'){ui.vp=t.value;renderSalesRows()}
  else if(id==='vm'){ui.vm=t.value;renderSalesRows()}
  else if(id==='sst'){ui.sst=t.value;render()}
  else if(id==='sm'){ui.sm=t.value;render()}
  else if(t.getAttribute&&t.getAttribute('data-sel')){ui.sel[t.getAttribute('data-sel')]=t.checked}
  else if(t.getAttribute&&t.getAttribute('data-pos')==='paymethod'){
    const i=parseInt(t.getAttribute('data-i'),10);cart.pay[i].mid=t.value;renderPay();updatePayStatus();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#pos'))closeModal();
  if(e.key==='Enter'&&e.target&&e.target.id==='posq'){
    e.preventDefault();
    const v=norm(e.target.value);if(!v)return;
    const exact=S.products.find(p=>p.active!==false&&p.sku&&norm(p.sku)===v);
    if(exact){posAdd(exact.id);return}
    const first=$('#posRes .rrow');if(first)posAdd(first.getAttribute('data-id'));
  }
});

boot();
})();
