<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2433; --ink-2:#173A52; --ink-3:#24506C;
  --accent:#FF5B1F; --accent-2:#E24A12; --accent-soft:#FFEDE5;
  --bg:#EEF1F4; --dot:#D7DEE5; --surface:#FFFFFF;
  --text:#13222E; --muted:#617080; --line:#DDE3E9; --line-2:#EDF0F3;
  --green:#14803C; --green-bg:#E3F6E9;
  --amber:#A8530B; --amber-bg:#FFF0DB;
  --red:#C62828; --red-bg:#FDE7E7;
  --blue:#1D4ED8; --blue-bg:#E6EEFF;
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --font-display:"Fredoka","Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif;
  --font-body:"DM Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  /* alias de compatibilidad */
  --navy:var(--ink); --navy2:var(--ink-2); --orange:var(--accent); --orange2:var(--accent-2); --card:var(--surface); --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
a{color:var(--blue)}
.hide{display:none}
.ic{flex:none;vertical-align:middle}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px;overflow:auto;z-index:60}
.brand{padding:0 10px 18px;display:flex;flex-direction:column;gap:4px}
.brand .logo{font-family:var(--font-display);font-weight:700;font-size:25px;letter-spacing:.2px;line-height:1}
.brand .logo b{color:var(--accent)}
.brand small{color:#86A0B4;font-size:13px}
#nav{display:flex;flex-direction:column}
.ng{font-size:12.5px;font-weight:600;color:#7F97A8;margin:18px 12px 6px}
.ni{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#C7D5E0;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;font-size:14.5px;text-align:left}
.ni:hover{background:rgba(255,255,255,.07);color:#fff}
.ni.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.ni:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ni .n{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px}
.ni .dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#34D399}
.side-foot{margin-top:auto;padding:18px 10px 0}
.side-foot svg{width:100%;height:auto;display:block;margin-bottom:10px}
.side-foot p{margin:0;color:#7F97A8;font-size:12.5px}

.shell{min-width:0;background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px,var(--dot) 1.3px,transparent 1.5px);background-size:22px 22px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 28px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-family:var(--font-display);font-weight:600;font-size:25px;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.menu{display:none}
.scrim{display:none}
main{max-width:1260px;margin:0 auto;padding:24px 28px 56px}
main>.title{display:none}

/* ---------- Estado de stock (arriba a la derecha) ---------- */
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.pill.ok{background:var(--green-bg);color:var(--green);border-color:#BDE8C9}
.pill.warn{background:var(--amber-bg);color:var(--amber);border-color:#F5D3A1}
.pill:focus-visible{outline:3px solid rgba(255,91,31,.4);outline-offset:1px}

/* ---------- Superficies ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.spacer{height:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.title{font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:12px}
.h3{font-family:var(--font-display);font-weight:600;font-size:18px;margin-bottom:12px}
.neg{color:var(--red)}.posv{color:var(--green)}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pagehead{justify-content:flex-end;margin-bottom:16px}
.pagehead .title{display:none}
.sec{margin-top:22px}
.sec h4{font-size:14.5px;font-weight:600;color:var(--muted);margin:0 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.empty{text-align:center;padding:40px 18px;color:var(--muted)}
.empty h3{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--text);margin-bottom:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.kv div{background:#F5F7F9;border-radius:12px;padding:11px 14px;display:flex;flex-direction:column;gap:2px}
.kv b{font-family:var(--font-display);font-weight:600;font-size:18px}
.kv span{font-size:12.5px;color:var(--muted)}
.list .it{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
.list .it:last-child{border:0}
.bar{height:8px;border-radius:99px;background:#E7ECF1;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ink-3);border-radius:99px}

/* ---------- Indicadores ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column-reverse;gap:4px}
.stat .l{color:var(--muted);font-size:13.5px;font-weight:500}
.stat .v{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.1}
.stat.alert{border-color:#F6C8B2;background:#FFFAF7}
.stat.alert .v{color:var(--accent-2)}
.stat.danger .v{color:var(--red)}

.banner{background:var(--amber-bg);border:1px solid #F5D3A1;border-left:4px solid #E58E1B;color:#6B3A0A;border-radius:var(--r-md);padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.banner.good{background:var(--green-bg);border-color:#BDE8C9;border-left-color:#22A559;color:#11512B}
.banner.info{background:var(--blue-bg);border-color:#C5D6FA;border-left-color:#3B6BE8;color:#16348A}

/* ---------- Botones (un solo sistema) ---------- */

/* ================= Conexión con Supabase ================= */

  const o={id:p.id,sku:p.sku,name:p.name,category_id:p.categoryId||null,supplier_id:p.supplierId||null,brand:p.brand||'',unit:p.unit||'unidad',location:p.location||'',min_stock:p.min||0,ideal_stock:p.ideal||0,cost:p.cost||0,price:p.price||0,buy_url:p.buyUrl||'',notes:p.notes||'',review:p.review||'',active:p.active!==false,photo_path:p.photoPath||null,price_history:p.priceHistory||[],pack_qty:p.packQty>0?p.packQty:1,loose_price:p.packQty>1&&p.loosePrice!=null?p.loosePrice:null};

/* ---------- Lectura ---------- */
async function pages(build,max){
  max=max||100000;let out=[],from=0;const step=Math.min(1000,max);
  for(;;){
    const r=await build().range(from,from+step-1);
    if(r.error)throw r.error;
    out=out.concat(r.data||[]);
    if((r.data||[]).length<step||out.length>=max)break;
    from+=step;
  }
  return out.slice(0,max);
}
function mergeById(old,add,cap){
  const m={};old.forEach(x=>{m[x.id]=x});add.forEach(x=>{m[x.id]=x});
  const out=Object.keys(m).map(k=>m[k]);
  out.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return out.slice(0,cap);
}
function photoUrl(path){return sbClient().storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
function rebuildPhotos(){PH={};S.products.forEach(p=>{if(p.photoPath)PH[p.id]=photoUrl(p.photoPath)})}
const LOADERS={
  categories:async()=>{S.categories=(await pages(()=>sb.from('categories').select('*').order('name').order('id'))).map(mCat)},
  suppliers:async()=>{S.suppliers=(await pages(()=>sb.from('suppliers').select('*').order('name').order('id'))).map(mSup)},
  pay_methods:async()=>{S.payMethods=(await pages(()=>sb.from('pay_methods').select('*').order('created_at').order('id'))).map(mPay)},
  products:async()=>{S.products=(await pages(()=>sb.from('products').select('*').order('name').order('id'))).map(mProd);rebuildPhotos()},
  stock_movements:async full=>{
    const rows=(await pages(()=>sb.from('stock_movements').select('*').order('created_at',{ascending:false}).order('id'),full?1500:300)).map(mMov);
    const ids={};S.products.forEach(p=>{ids[p.id]=1});
    S.movements=mergeById(full?[]:S.movements,rows,1500).filter(m=>!m.productId||ids[m.productId]);
  },
  sales:async full=>{
    const rows=(await pages(()=>sb.from('sales').select('*').order('date',{ascending:false}).order('id'),full?3000:300)).map(mSale);
    S.sales=mergeById(full?[]:S.sales,rows,3000);
  },
  settlements:async()=>{
    const since=new Date(Date.now()-60*86400000).toISOString();
    const a=await pages(()=>sb.from('settlements').select('*').eq('status','pending').order('id'));
    const b=await pages(()=>sb.from('settlements').select('*').gte('date',since).order('date',{ascending:false}).order('id'),3000);
    const m={};a.concat(b).forEach(r=>{m[r.id]=mSet(r)});
    S.settlements=Object.keys(m).map(k=>m[k]).sort((x,y)=>String(y.date).localeCompare(String(x.date)));
  },
  cash_sessions:async()=>{
    S.cash.sessions=(await pages(()=>sb.from('cash_sessions').select('*').order('opened_at',{ascending:false}).order('id'),200)).map(mSess);
    const open=S.cash.sessions.find(s=>!s.closedAt);S.cash.current=open?open.id:null;
  }
};
const ORDER=['categories','suppliers','pay_methods','products','stock_movements','sales','settlements','cash_sessions'];
async function reload(tables,full){
  sbClient();
  const list=(tables||ORDER).filter(k=>LOADERS[k]);
  // productos antes que movimientos (los movimientos se filtran por productos existentes)
  const first=list.filter(k=>k==='products'),rest=list.filter(k=>k!=='products');
  if(first.length)await LOADERS.products();
  await Promise.all(rest.map(k=>LOADERS[k](!!full)));
}
async function safeReload(tables){try{await reload(tables)}catch(e){}}

/* ---------- Errores y escritura ---------- */
function errMsg(e){
  if(!e)return 'Error desconocido';
  const m=String(e.message||e);
  if(/Failed to fetch|fetch failed|NetworkError|Load failed|network/i.test(m))return 'Sin conexión con el servidor. Revisá tu internet e intentá de nuevo.';
  if(/JWT|expired|not authenticated/i.test(m))return 'Se venció la sesión. Salí y volvé a ingresar.';
  if(/row-level security|permission denied/i.test(m))return 'No tenés permiso para hacer esto. Salí y volvé a ingresar.';
  return m;
}
async function attempt(fn,dup){
  try{const r=await fn();if(r&&r.error)throw r.error;return {ok:true,data:r?r.data:null}}
  catch(e){toast(e&&e.code==='23505'&&dup?dup:errMsg(e),'err');return {ok:false,error:e}}
}
async function writeRows(table,rows,mode){
  for(let i=0;i<rows.length;i+=200){
    const part=rows.slice(i,i+200);
    const r=mode==='upsert'?await sb.from(table).upsert(part):await sb.from(table).insert(part);
    if(r.error)throw r.error;
  }
}
async function insertNewProducts(list,reason){
  const need=list.filter(p=>!p.sku);
  for(let i=0;i<need.length;i+=1000){
    const part=need.slice(i,i+1000);
    const r=await sb.rpc('next_skus',{p_count:part.length});
    if(r.error)throw r.error;
    part.forEach((p,k)=>{p.sku=r.data[k]});
  }
  await writeRows('products',list.map(p=>prodRow(p,true)),'insert');
  const moves=list.filter(p=>p.stock>0).map(p=>({product_id:p.id,name:p.name,unit:p.unit,type:'in',qty:p.stock,delta:p.stock,stock_after:p.stock,reason:reason||'Stock inicial',note:''}));
  await writeRows('stock_movements',moves,'insert');
}
function dataUrlToBlob(d){
  const m=/^data:([^;]+);base64,(.*)$/.exec(d);const bin=atob(m[2]);const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:m[1]});
}

/* ---------- Tiempo real: lo que cambia otra persona aparece solo ---------- */
function startRealtime(){
  if(RT)return;
  try{
    RT=sb.channel('ferreteria-jr').on('postgres_changes',{event:'*',schema:'public'},p=>{
      if(p&&p.new&&p.new.store_id&&STORE&&p.new.store_id!==STORE)return;
      if(p&&p.table){rtSet[p.table]=1;clearTimeout(rtTimer);rtTimer=setTimeout(flushRealtime,800)}
    }).subscribe();
  }catch(e){RT=null}
}
function stopRealtime(){try{if(RT)sb.removeChannel(RT)}catch(e){}RT=null;clearTimeout(rtTimer);rtSet={}}
async function flushRealtime(){
  if(!ready)return;
  const a=document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&$('#view').contains(a)){rtTimer=setTimeout(flushRealtime,1500);return}
  const t=Object.keys(rtSet);rtSet={};
  if(!t.length)return;
  try{await reload(t,false);render()}catch(e){}
}

async function loadAccess(){
  const c=sbClient();
  const pr=await c.from('profiles').select('*').eq('user_id',USER.id);
  if(pr.error)throw pr.error;
  ME={admin:!!(pr.data&&pr.data[0]&&pr.data[0].is_admin)};
  const st=await c.from('stores').select('*').order('name');
  if(st.error)throw st.error;
  STORES=(st.data||[]).map(r=>({id:r.id,name:r.name,lastBackup:r.last_backup_at||null,createdBy:r.created_by||null}));
  const mm=await c.from('memberships').select('*').eq('user_id',USER.id);
  if(mm.error)throw mm.error;
  MYROLES={};(mm.data||[]).forEach(m=>{MYROLES[m.store_id]=m.role||'manager'});
  try{const dm=await c.rpc('delete_store_mode');DELMODE=dm.error?null:(dm.data||null)}catch(e){DELMODE=null}
}
function renderStoreSel(){
  const sel=$('#storeSel');if(!sel)return;
  const vis=visibleStores();
  sel.innerHTML=vis.map(s=>'<option value="'+esc(s.id)+'"'+(s.id===STORE?' selected':'')+'>'+esc(s.name)+'</option>').join('')+(canCreateStore()?'<option value="__new">＋ Crear nueva ferretería…'+(ME.admin?'':' (te quedan '+(MAX_OWN-ownedCount())+')')+'</option>':'');
  const mr=$('#myRole');if(mr)mr.innerHTML=STORE?'Tu rol acá: <b>'+esc(ROLES[curRole()]||'—')+'</b>':'';
  applyPermClasses();
  const eye=$('#storeHide');eye.innerHTML=ic('eyeoff',17);eye.hidden=vis.length<2;
  const n=STORES.length-vis.length,sh=$('#showHidden');
  sh.hidden=n<1;sh.textContent=n>0?'ver ocultas ('+n+')':'';
}
function resetView(){
  S=emptyState();PH={};cart=null;closeModal();ui.tab='panel';
  Object.assign(ui,UI0,{sel:{}});
}
async function startStore(id){
  setStore(id);lsSet(STORE_KEY+':'+USER.id,id);renderStoreSel();
  $('#view').innerHTML='<div class="card empty">Cargando datos…</div>';
  try{await reload(null,true)}
  catch(e){
    $('#view').innerHTML='<div class="card empty"><h3>No se pudieron cargar los datos</h3><p>'+esc(errMsg(e))+'</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="retry">Reintentar</button><button class="btn" data-act="logout">Salir</button></div></div>';
    return false;
  }
  ready=true;render();startRealtime();return true;
}
async function switchStore(id){
  if(id===STORE)return;
  if(cart&&!confirm('Hay una venta sin terminar. Si cambiás de ferretería se descarta. ¿Cambiar igual?')){renderStoreSel();return}
  ready=false;stopRealtime();resetView();
  await startStore(id);
}
async function enter(user){
  USER=user;$('#whoEmail').textContent=user.email||'';
  $('#auth').hidden=true;document.body.classList.remove('locked');
  $('#view').innerHTML='<div class="card empty">Cargando datos…</div>';
  try{await loadAccess()}
  catch(e){
    $('#view').innerHTML='<div class="card empty"><h3>No se pudieron cargar los datos</h3><p>'+esc(errMsg(e))+'</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="retry">Reintentar</button><button class="btn" data-act="logout">Salir</button></div></div>';
    return;
  }
  if(!STORES.length){
    $('#storeSel').innerHTML='';
    $('#view').innerHTML='<div class="card empty"><h3>Todavía no tenés ninguna ferretería asignada</h3><p>Pedile a quien administra el sistema que te dé acceso.</p><div class="row" style="justify-content:center"><button class="btn" data-act="retry">Volver a revisar</button><button class="btn" data-act="logout">Salir</button></div></div>';
    return;
  }
  const vis=visibleStores();
  const pool=vis.length?vis:STORES;
  if(!vis.length)setHidden([]);
  const last=lsGet(STORE_KEY+':'+user.id);
  const first=pool.find(s=>s.id===last)||pool[0];
  await startStore(first.id);
}
function leave(){
  stopRealtime();USER=null;ready=false;STORE=null;STORES=[];ME={admin:false};ADM=null;MYROLES={};TEAM=null;DELMODE=null;applyPermClasses();
  try{if(sb&&sb._setStore)sb._setStore(null)}catch(e){}
  resetView();
  $('#view').innerHTML='';
  showLogin();
}
function backupDue(){
  const s=STORES.find(x=>x.id===STORE);if(!s||!ready)return null;
  if(!s.lastBackup)return {s,days:null};
  const d=Math.floor((Date.now()-new Date(s.lastBackup).getTime())/86400000);
  return d>=BACKUP_DAYS?{s,days:d}:null;
}
// Al salir: si hace más de una semana que no se descarga una copia de esta ferretería, lo recuerda.
function logout(){
  const due=backupDue();
  if(!due)return doLogout();
  openSheet('Antes de salir',
    '<p style="margin-top:0">'+(due.days==null?'Todavía no se descargó ninguna copia de seguridad de <b>'+esc(due.s.name)+'</b>.':'Hace <b>'+due.days+' días</b> que no se descarga una copia de seguridad de <b>'+esc(due.s.name)+'</b>.')+'</p>'+
    '<p class="muted small">Los datos están guardados en la nube. La copia es un resguardo extra por si algún día hace falta recuperar algo: guardala en Google Drive. Tarda un segundo.</p>'+
    '<div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" data-act="exit-now">Salir sin copia</button><button class="btn primary" data-act="backup-exit">'+ic('download',16)+'Descargar copia y salir</button></div>');
}
async function backupAndExit(){
  await exportJSON();
  closeModal();
  setTimeout(doLogout,600);
}
async function doLogout(){
  try{await sbClient().auth.signOut()}catch(e){}
  if(USER)leave();
}
async function doLogin(e){
  e.preventDefault();
  const email=$('#loginEmail').value.trim(),pass=$('#loginPass').value;
  if(!email||!pass)return;
  const btn=$('#loginBtn');btn.disabled=true;btn.textContent='Ingresando…';$('#loginErr').textContent='';
  try{
    const r=await sbClient().auth.signInWithPassword({email,password:pass});
    if(r.error)throw r.error;
    $('#loginPass').value='';
    await enter(r.data.user);
  }catch(err){
    const m=String(err&&err.message||err);
    showLogin(/invalid login|credentials/i.test(m)?'Email o contraseña incorrectos.':errMsg(err));
  }
}
function setOnline(){const n=$('#netbar');if(n)n.hidden=navigator.onLine!==false}
async function boot(){
  window.addEventListener('online',setOnline);window.addEventListener('offline',setOnline);setOnline();
  $('#loginForm').addEventListener('submit',doLogin);
  let session=null;
  try{
    const c=sbClient();
    const r=await c.auth.getSession();session=r.data&&r.data.session;
    c.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')setTimeout(()=>{if(USER)leave()},0)});
  }catch(e){showLogin(errMsg(e));return}
  if(session&&session.user)await enter(session.user);else showLogin();
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
const money=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:0,maximumFractionDigits:2});
function fm(n){return money.format(n||0)}
function fq(n){n=Number(n)||0;return (Math.round(n*100)/100).toLocaleString('es-AR')}
function round2(n){return Math.round((Number(n)+Number.EPSILON)*100)/100}
function fdate(iso){try{return new Date(iso).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fday(s){const p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:''}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
// Lee números escritos a la argentina (1.234,56) o con punto decimal (1234.56), con o sin $.
// mode: 'ar' = punto de miles y coma decimal · 'us' = coma de miles y punto decimal · 'auto' = lo deduce.
function parseNum(v,mode){
  let s=String(v==null?'':v).trim().replace(/\$/g,'').replace(/[\s\u00a0']/g,'');
  if(s==='')return NaN;
  let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(s[0]==='-'){neg=!neg;s=s.slice(1)}else if(s[0]==='+')s=s.slice(1);
  if(!/^[0-9.,]+$/.test(s)||!/[0-9]/.test(s))return NaN;
  const hasC=s.indexOf(',')>-1,hasD=s.indexOf('.')>-1;
  if(mode==='ar')s=s.replace(/\./g,'').replace(',','.');
  else if(mode==='us')s=s.replace(/,/g,'');
  else if(hasC&&hasD){ // el último separador es el decimal
    if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');
  } else if(hasC){
    s=/^\d{1,3}(,\d{3}){2,}$/.test(s)?s.replace(/,/g,''):s.replace(',','.');
  } else if(hasD){
    if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');              // 1.234.567
    else if(/^[1-9]\d{0,2}\.\d{3}$/.test(s))s=s.replace('.','');          // 1.500 = mil quinientos
  }
  if((s.match(/\./g)||[]).length>1)return NaN;
  const n=parseFloat(s);if(isNaN(n))return NaN;
  return neg?-n:n;
}
function num(v,mode){const n=parseNum(v,mode);return isNaN(n)?0:n}
// Para mostrar un número dentro de un campo: coma decimal, sin separador de miles (así se lee igual al volver a guardarlo)
function inNum(v){if(v===''||v==null)return '';const n=Number(v);if(isNaN(n))return '';return String(Math.round(n*10000)/10000).replace('.',',')}
// Detecta el formato numérico de todo un archivo (para no mezclar 1.500 = mil quinientos con 1.5 = uno y medio)
function detectNumFormat(cells){
  let ar=0,us=0;
  cells.forEach(c=>{
    const s=String(c||'').trim().replace(/\$/g,'').replace(/\s/g,'');if(!s)return;
    if(/\d,\d{1,2}$/.test(s)||/\d,\d{4,}$/.test(s)||/\.\d{3},\d+$/.test(s))ar++;
    else if(/\d\.\d{1,2}$/.test(s)||/\d\.\d{4,}$/.test(s)||/,\d{3}\.\d+$/.test(s))us++;
  });
  if(ar&&!us)return 'ar';if(us&&!ar)return 'us';return 'auto';
}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function safeUrl(u){
  u=String(u||'').trim();if(!u)return '';
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  try{const x=new URL(u);return (x.protocol==='http:'||x.protocol==='https:')?x.href:''}catch(e){return ''}
}
function catName(id){const c=S.categories.find(x=>x.id===id);return c?c.name:'Sin categoría'}
function supObj(id){return S.suppliers.find(x=>x.id===id)}

function status(p){
  if(p.active===false) return 'off';
  if(p.stock<=0) return 'out';
  if(p.min>0&&p.stock<=p.min) return 'low';
  return 'ok';
}
function needs(){return S.products.filter(p=>{const s=status(p);return s==='low'||s==='out'})}
function suggested(p){
  const target=p.ideal>0?p.ideal:(p.min>0?p.min*2:1);
  return Math.max(0,Math.round((target-p.stock)*100)/100);
}
function badge(p){

  return '<span class="badge '+s+'">'+({ok:'OK',low:'Stock bajo',out:'Sin stock',off:'Inactivo'})[s]+'</span>';
}
function thumb(p,size){

function toast(msg,kind){
  const d=document.createElement('div');d.className='toast '+(kind||'');d.textContent=msg;
  $('#toasts').appendChild(d);setTimeout(()=>d.remove(),kind==='err'?6000:3800);

function download(name,text,mime){
  const b=new Blob([text],{type:mime||'text/plain'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).then(()=>toast('Copiado al portapapeles'),()=>fallbackCopy(t));
  }
  fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Copiado al portapapeles')}catch(e){toast('No se pudo copiar','err')}
  ta.remove();
}
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(d.length===10)d='549'+d;return d}
function options(list,sel,blank){
  return (blank!==undefined?'<option value="">'+esc(blank)+'</option>':'')+list.map(o=>{
    const v=typeof o==='string'?o:o.id,l=typeof o==='string'?o:o.name;
    return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(l)+'</option>';
  }).join('');
}
function compressImage(file,maxPx,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const s=Math.min(1,maxPx/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
        const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
        // WebP pesa bastante menos que JPEG con la misma calidad; si el navegador no lo soporta, JPEG
        let d='';try{d=c.toDataURL('image/webp',q)}catch(e){}
        res(/^data:image\/webp/.test(d)?d:c.toDataURL('image/jpeg',q));
      };
      img.onerror=()=>rej(new Error('imagen'));img.src=fr.result;
    };
    fr.onerror=()=>rej(new Error('archivo'));fr.readAsDataURL(file);
  });
}

/* ================= Movimientos de stock ================= */

async function applyMovement(p,type,qty,reason,note){
  const before=p.stock,wasOk=status(p)==='ok';
  if(type==='out'&&qty>before){toast('No hay stock suficiente: hay '+fq(before)+' '+p.unit,'err');return false}
  const r=await attempt(()=>sb.rpc('apply_movement',{p_product:p.id,p_type:type,p_qty:qty,p_reason:reason||'',p_note:note||''}));
  if(!r.ok){await safeReload(['products']);return false}
  await reload(['products','stock_movements']);
  const np=prod(p.id)||p,s=status(np);
  if(wasOk&&s==='low')toast('⚠ '+p.name+' quedó con stock bajo ('+fq(np.stock)+')','warn');
  else if(s==='out'&&before>0)toast('⛔ '+p.name+' se quedó sin stock','warn');
  else toast('Movimiento registrado');
  return true;
}
// Venta suelta: precio por unidad (el cargado, o el de la caja dividido por las unidades que trae)
function isPack(p){return !!p&&(p.packQty||1)>1}
function unitPrice(p){if(!isPack(p))return p.price||0;return p.loosePrice!=null?p.loosePrice:round2((p.price||0)/p.packQty)}
function unitCost(p){return isPack(p)?(p.cost||0)/p.packQty:(p.cost||0)}
// Stock con fracciones: "2 caja + 350 u."
function fstock(p,v){
  v=v==null?p.stock:v;
  if(isPack(p)){
    const whole=Math.floor(v+1e-7),rest=Math.round((v-whole)*p.packQty);
    if(rest>0&&rest<p.packQty)return (whole?fq(whole)+' '+esc(p.unit)+' + ':'')+fq(rest)+' u.';
    if(rest>=p.packQty)return fq(whole+1)+' '+esc(p.unit);
  }
  return fq(v)+' '+esc(p.unit);
}
function looseInfo(p){return isPack(p)?'<div class="small muted">Suelto: '+fm(unitPrice(p))+' c/u ('+fq(p.packQty)+' por '+esc(p.unit)+')</div>':''}
function iq(i){return i.stockQty!=null?Number(i.stockQty):i.qty}   // cantidad en la unidad del stock
function setPrices(p,cost,price,reason){
  cost=round2(cost);price=round2(price);
  if(cost===(p.cost||0)&&price===(p.price||0)&&p.priceHistory&&p.priceHistory.length) return;
  p.cost=cost;p.price=price;
  p.priceHistory=p.priceHistory||[];
  p.priceHistory.unshift({date:new Date().toISOString(),cost,price,reason:reason||'',by:USER?USER.email:''});
  if(p.priceHistory.length>30)p.priceHistory.length=30;
}

/* ================= Caja ================= */
function currentSession(){
  const id=S.cash.current;
  return S.cash.sessions.find(s=>s.id===id&&!s.closedAt)||null;
}
function cajaTotals(sess){
  const sales=S.sales.filter(s=>s.sessionId===sess.id&&!s.voided);
  const byM={};let cash=0,total=0;
  sales.forEach(s=>{total+=s.total;s.payments.forEach(p=>{byM[p.methodName]=round2((byM[p.methodName]||0)+p.amount);if(p.type==='cash')cash+=p.amount})});
  let inn=0,out=0;(sess.moves||[]).forEach(m=>{if(m.type==='in')inn+=m.amount;else out+=m.amount});
  return {sales,count:sales.length,total:round2(total),byM,cash:round2(cash),inn:round2(inn),out:round2(out),expected:round2(sess.opening+cash+inn-out)};
}
function cajaOpenModal(after){
  const last=S.cash.sessions.find(s=>s.closedAt);
  openModal('Abrir caja',
    '<label class="f">Efectivo inicial en la caja (fondo)<input name="opening" type="text" inputmode="decimal" autocomplete="off" data-num required value="'+inNum((last&&last.counted!=null?last.counted:0))+'"></label>'+
    '<p class="muted small">Contá el efectivo que hay ahora en el cajón. Se propone lo que quedó en el último cierre.</p>',
    async fd=>{
      const id=uid();
      const r=await attempt(()=>sb.from('cash_sessions').insert({id,opening:round2(num(fd.opening))}),'Ya hay una caja abierta (la abrió otra persona o otro dispositivo).');
      await safeReload(['cash_sessions']);
      if(!r.ok){if(currentSession()){closeModal();render()}return false}
      toast('Caja abierta');
      if(after)setTimeout(after,0);
    },'Abrir caja');
}
function cajaMoveModal(type){
  openModal(type==='in'?'Ingreso de efectivo':'Egreso de efectivo',
    '<div class="fgrid"><label class="f">Monto<input name="amount" type="text" inputmode="decimal" autocomplete="off" data-num required></label>'+
    '<label class="f">Concepto<input name="concept" list="cc" required value="'+(type==='out'?'Pago a proveedor':'Aporte de efectivo')+'"><datalist id="cc">'+CAJA_CONCEPTS.map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist></label>'+
    '<label class="f full">Nota (opcional)<input name="note"></label></div>',
    async fd=>{
      const a=round2(num(fd.amount));if(a<=0){toast('Ingresá un monto mayor a 0','err');return false}
      const sess=currentSession();if(!sess){toast('La caja está cerrada','err');return false}
      const r=await attempt(()=>sb.rpc('add_cash_move',{p_session:sess.id,p_type:type,p_amount:a,p_concept:fd.concept.trim(),p_note:(fd.note||'').trim()}));
      await safeReload(['cash_sessions']);
      if(!r.ok)return false;
      toast('Movimiento de caja registrado');
    });
}
function cajaCloseModal(){
  const sess=currentSession();if(!sess)return;
  const t=cajaTotals(sess);
  openModal('Cerrar caja',
    '<div class="kv"><div><span>Fondo inicial</span><b>'+fm(sess.opening)+'</b></div><div><span>Ventas en efectivo</span><b>'+fm(t.cash)+'</b></div><div><span>Ingresos manuales</span><b>'+fm(t.inn)+'</b></div><div><span>Egresos manuales</span><b>'+fm(t.out)+'</b></div></div>'+
    '<div class="banner info" style="margin:0 0 12px">Efectivo que debería haber: <b>'+fm(t.expected)+'</b></div>'+
    '<div class="fgrid"><label class="f">Efectivo contado<input name="counted" type="text" inputmode="decimal" autocomplete="off" data-num required value="'+inNum(t.expected)+'"></label>'+
    '<label class="f">Nota (opcional)<input name="note" placeholder="Ej: faltante de cambio"></label></div>'+
    '<p class="muted small">Ventas totales de este turno: <b>'+fm(t.total)+'</b> en '+t.count+' venta'+(t.count===1?'':'s')+'. Lo que no es efectivo (tarjetas, transferencias, fiado) no se cuenta acá: lo ves en Liquidaciones.</p>',
    async fd=>{
      const counted=round2(num(fd.counted));
      const r=await attempt(()=>sb.rpc('close_cash',{p_session:sess.id,p_counted:counted,p_note:(fd.note||'').trim()}));
      await safeReload(['cash_sessions']);
      if(!r.ok)return false;
      const diff=round2(N(r.data&&r.data.diff));
      toast(diff===0?'Caja cerrada: sin diferencias ✓':'Caja cerrada. Diferencia: '+fm(diff),diff===0?'':'warn');
    },'Cerrar caja');
}
/* ================= Ventas ================= */
function saleLines(pid){
  const out=[];
  S.sales.forEach(s=>{if(s.voided)return;s.items.forEach(it=>{if(it.productId===pid)out.push({sale:s,it})})});
  return out;
}
function profitOf(s){return round2(s.total-s.items.reduce((a,it)=>a+it.cost*it.qty,0))}
async function createSale(cartData){
  const sess=currentSession();
  if(!sess){toast('Abrí la caja para vender','err');return null}
  if(!cartData.saleId)cartData.saleId=uid();   // si se reintenta por un corte de internet, no se duplica la venta
  const payload={id:cartData.saleId,session_id:sess.id,
    items:cartData.items.map(it=>({productId:it.pid,qty:it.qty,price:round2(it.price),loose:!!it.loose})),
    discount:round2(cartData.discount||0),
    payments:cartData.pay.filter(p=>p.amount>0).map(p=>({methodId:p.mid,amount:round2(p.amount)})),
    customer:(cartData.customer||'').trim(),note:(cartData.note||'').trim()};
  const wasOk={};cartData.items.forEach(it=>{const p=prod(it.pid);if(p)wasOk[p.id]=status(p)==='ok'});
  let res=null;
  try{
    const r=await sb.rpc('create_sale',{p:payload});
    if(r.error)throw r.error;
    res=r.data;
  }catch(e){
    if(e&&e.code==='23505'){ // la venta ya se había guardado (se cortó la respuesta)
      await safeReload(['products','stock_movements','sales','settlements']);
      const ex=S.sales.find(s=>s.id===payload.id);
      if(ex)return ex;
    }
    toast(errMsg(e),'err');await safeReload(['products','cash_sessions']);return null;
  }
  await reload(['products','stock_movements','sales','settlements']);
  const alerts=[];
  Object.keys(wasOk).forEach(id=>{const p=prod(id);if(p&&wasOk[id]){const st=status(p);if(st==='low'||st==='out')alerts.push(p.name)}});
  if(alerts.length)toast('⚠ Stock bajo: '+alerts.slice(0,3).join(', ')+(alerts.length>3?'…':''),'warn');
  return S.sales.find(s=>s.id===payload.id)||{id:payload.id,number:res.number,total:res.total};
}
async function voidSale(id){
  const s=S.sales.find(x=>x.id===id);if(!s||s.voided)return;
  if(!(S.cash.current&&s.sessionId===S.cash.current)){toast('Solo se pueden anular ventas del turno de caja abierto. Esa caja ya está cerrada.','err');return}
  if(S.settlements.some(x=>x.saleId===id&&x.status==='settled'&&x.received!=null)){toast('Esta venta ya tiene cobros registrados; no se puede anular.','err');return}
  if(!confirm('¿Anular la venta #'+s.number+' por '+fm(s.total)+'? El stock vuelve al inventario.'))return;
  const r=await attempt(()=>sb.rpc('void_sale',{p_id:id}));
  await safeReload(['products','stock_movements','sales','settlements']);
  if(!r.ok)return;
  closeModal();render();toast('Venta anulada');
}
function saleText(s){
  let t=storeName()+' · Venta #'+s.number+' · '+fdate(s.date)+'\n';
  s.items.forEach(i=>{t+='- '+i.name+(i.loose?' (suelto)':'')+' x'+fq(i.qty)+' '+i.unit+' = '+fm(i.qty*i.price)+'\n'});
  if(s.discount)t+='Descuento: -'+fm(s.discount)+'\n';
  t+='TOTAL: '+fm(s.total)+'\nPago: '+s.payments.map(p=>p.methodName+' '+fm(p.amount)).join(' + ');
  return t;
}
function periodRange(k){
  const now=new Date();
  if(k==='today')return [startOfDay(now),null];
  if(k==='yesterday')return [startOfDay(addDays(now,-1)),startOfDay(now)];
  if(k==='7')return [startOfDay(addDays(now,-6)),null];
  if(k==='month')return [new Date(now.getFullYear(),now.getMonth(),1),null];
  return [null,null];
}
function inRange(iso,r){const t=new Date(iso).getTime();return (!r[0]||t>=r[0].getTime())&&(!r[1]||t<r[1].getTime())}
function filteredSales(){
  const r=periodRange(ui.vp),q=norm(ui.vq);
  return S.sales.filter(s=>{
    if(!inRange(s.date,r))return false;
    if(ui.vm&&!s.payments.some(p=>p.methodId===ui.vm))return false;
    if(q){const hay=norm('#'+s.number+' '+s.number+' '+s.customer+' '+s.items.map(i=>i.name).join(' '));return q.split(' ').every(w=>hay.indexOf(w)>-1)}
    return true;
  });
}

function viewPanel(){
  if(!S.products.length){
    return '<div class="card empty"><h3>Bienvenida a '+esc(storeName())+'</h3><p>Todavía no hay productos cargados. Podés empezar así:</p>'+
      '<div class="row" style="justify-content:center"><button class="btn" data-act="new-product">Cargar un producto</button>'+
      '<button class="btn" data-act="import-csv">Importar desde Excel/CSV</button></div></div>';
  }
  const need=needs();
  const out=need.filter(p=>status(p)==='out').length;
  const value=S.products.reduce((a,p)=>a+(p.cost||0)*Math.max(p.stock,0),0);
  const today=S.sales.filter(s=>!s.voided&&inRange(s.date,periodRange('today')));
  const todayTotal=today.reduce((a,s)=>a+s.total,0);
  const sess=currentSession();
  const pendEl=S.settlements.filter(x=>x.status==='pending'&&x.kind==='electronic').reduce((a,x)=>a+x.net,0);
  const pendCr=S.settlements.filter(x=>x.status==='pending'&&x.kind==='credit').reduce((a,x)=>a+x.gross,0);
  let h='';
  if(!sess) h+='<div class="banner info"><div><b>La caja está cerrada.</b> Abrila para empezar a registrar ventas del día.</div><button class="btn" data-act="caja-open">Abrir caja</button></div>';
  const nrev=S.products.filter(p=>p.review).length;
  if(nrev) h+='<div class="banner info"><div><b>'+nrev+' producto'+(nrev>1?'s':'')+' del Excel con datos para revisar.</b> Falta el costo o la cantidad, o el precio parece raro.</div><button class="btn" data-act="go-review">Ver productos</button></div>';
  if(need.length) h+='<div class="banner"><div><b>'+need.length+' producto'+(need.length>1?'s':'')+' necesita'+(need.length>1?'n':'')+' reposición</b> ('+out+' sin stock).</div><button class="btn" data-act="nav" data-tab="faltantes">Ver lista de faltantes</button></div>';
  h+='<div class="stats">'+
    '<div class="stat"><div class="v">'+fm(todayTotal)+'</div><div class="l">Vendido hoy · '+today.length+' venta'+(today.length===1?'':'s')+'</div></div>'+
    '<div class="stat"><div class="v">'+(sess?fm(cajaTotals(sess).expected):'—')+'</div><div class="l">'+(sess?'Efectivo esperado en caja':'Caja cerrada')+'</div></div>'+
    '<div class="stat alert"><div class="v">'+fm(pendEl)+'</div><div class="l">Por acreditar (tarjetas, MP)</div></div>'+
    '<div class="stat alert"><div class="v">'+fm(pendCr)+'</div><div class="l">Fiado por cobrar</div></div>'+
    '<div class="stat danger"><div class="v">'+need.length+'</div><div class="l">Productos para reponer</div></div>'+
    '<div class="stat"><div class="v">'+fm(value)+'</div><div class="l">Valor del stock (a costo)</div></div></div><div class="spacer"></div>';
  h+='<div class="grid2"><div class="card"><div class="h3">Necesitan reposición</div>';
  if(!need.length) h+='<div class="muted">Nada pendiente.</div>';
  else h+='<div class="list">'+need.slice().sort((a,b)=>a.stock-b.stock).slice(0,8).map(p=>
    '<div class="it"><div class="pcell">'+thumb(p,36)+'<div><div class="pname linkish" data-act="ficha" data-id="'+p.id+'">'+esc(p.name)+'</div><div class="small muted">'+esc(catName(p.categoryId))+' · mínimo '+fq(p.min)+'</div></div></div>'+
    '<div style="text-align:right">'+badge(p)+'<div class="small"><b>'+fstock(p)+'</b></div></div></div>').join('')+'</div>';
  h+='</div><div class="card"><div class="h3">Últimas ventas</div>';
  const recent=S.sales.filter(s=>!s.voided).slice(0,7);
  if(!recent.length) h+='<div class="muted">Todavía no hay ventas registradas.</div>';
  else h+='<div class="list">'+recent.map(s=>'<div class="it linkish" data-act="view-sale" data-id="'+s.id+'"><div><div class="pname">#'+s.number+' · '+esc(s.customer||'Mostrador')+'</div><div class="small muted">'+fdate(s.date)+' · '+esc(s.payments.map(p=>p.methodName).join(' + '))+'</div></div><b>'+fm(s.total)+'</b></div>').join('')+'</div>';
  h+='</div></div>';
  const since=startOfDay(addDays(new Date(),-29));const agg={};
  S.sales.forEach(s=>{if(s.voided||new Date(s.date)<since)return;s.items.forEach(i=>{const a=agg[i.productId]=agg[i.productId]||{name:i.name,qty:0,rev:0,unit:i.unit,id:i.productId};a.qty+=iq(i);if(i.stockUnit)a.unit=i.stockUnit;a.rev+=i.qty*i.price})});
  const top=Object.keys(agg).map(k=>agg[k]).sort((a,b)=>b.rev-a.rev).slice(0,6);
  h+='<div class="grid2"><div class="card"><div class="h3">Más vendidos (30 días)</div>';
  if(!top.length)h+='<div class="muted">Se arma solo a medida que registres ventas.</div>';
  else{const mx=top[0].rev||1;h+=top.map(t=>'<div style="margin-bottom:10px"><div class="gh" style="margin:0"><b class="linkish" data-act="ficha" data-id="'+t.id+'">'+esc(t.name)+'</b><span class="small muted">'+fq(t.qty)+' '+esc(t.unit)+' · '+fm(t.rev)+'</span></div><div class="bar"><i style="width:'+Math.round(t.rev/mx*100)+'%"></i></div></div>').join('')}
  h+='</div><div class="card"><div class="h3">Stock por categoría</div>';
  let max=1;const rows=S.categories.map(c=>{
    const ps=S.products.filter(p=>p.categoryId===c.id);
    const al=ps.filter(p=>{const s=status(p);return s==='low'||s==='out'}).length;
    if(ps.length>max)max=ps.length;
    return {c,n:ps.length,al};
  }).filter(r=>r.n>0);
  h+=rows.map(r=>'<div style="margin-bottom:10px"><div class="gh" style="margin:0"><b>'+esc(r.c.name)+'</b><span class="small muted">'+r.n+' producto'+(r.n>1?'s':'')+(r.al?' · <b style="color:var(--orange2)">'+r.al+' para reponer</b>':'')+'</span></div><div class="bar"><i style="width:'+Math.round(r.n/max*100)+'%"></i></div></div>').join('');
  return h+'</div></div>';
}
// Historial completo de un producto: se pide a la base recién cuando se abre (no carga la página)
async function openHistory(id){
  const p=prod(id);if(!p)return;
  openSheet('Historial de '+p.name,'<div class="card empty">Cargando historial…</div>');
  let rows=[];
  try{
    const r=await sbClient().from('stock_movements').select('*').eq('product_id',id).order('created_at',{ascending:false}).limit(500);
    if(r.error)throw r.error;rows=(r.data||[]).map(mMov);
  }catch(e){openSheet('Historial de '+p.name,'<div class="card empty"><p>'+esc(errMsg(e))+'</p></div>');return}
  const ev=rows.map(m=>{
    const kind=/^Venta/.test(m.reason)?'Venta':/^Anulaci/.test(m.reason)?'Anulación':/^Stock inicial/.test(m.reason)?'Alta':m.type==='in'?'Ingreso':m.type==='out'?'Salida':'Ajuste de conteo';
    return {date:m.date,kind,txt:(m.reason&&m.reason!==kind?esc(m.reason):'')+(m.note?(m.reason?' · ':'')+esc(m.note):''),
      qty:'<span class="'+(m.delta>0?'d-in':m.delta<0?'d-out':'d-adj')+'">'+(m.delta>0?'+':m.delta<0?'−':'')+fstock(p,Math.abs(m.delta))+'</span><div class="small muted">quedó '+fstock(p,m.after)+'</div>',by:m.by};
  });
  (p.priceHistory||[]).forEach(x=>ev.push({date:x.date,kind:'Precio',txt:'Costo '+fm(x.cost)+' · venta '+fm(x.price)+(x.reason?' · '+esc(x.reason):''),qty:'',by:x.by||''}));
  ev.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const h='<div class="small muted" style="margin-bottom:8px">Ventas, ingresos, salidas, ajustes, anulaciones y cambios de precio de este producto, con fecha y quién lo hizo. Stock actual: <b>'+fstock(p)+'</b>.</div>'+
    (ev.length?'<div class="list hist">'+ev.map(e=>'<div class="it"><div><div><span class="tag">'+e.kind+'</span> '+e.txt+'</div><div class="small muted">'+fdate(e.date)+(e.by?' · '+esc(String(e.by).split('@')[0]):'')+'</div></div><div style="text-align:right">'+e.qty+'</div></div>').join('')+'</div>':'<div class="muted">Sin historial todavía.</div>')+
    (rows.length>=500?'<p class="small muted">Se muestran los últimos 500 movimientos.</p>':'');
  openSheet('Historial de '+p.name,h);
}
function movLine(m){
  const cls=m.type==='in'?'d-in':m.type==='out'?'d-out':'d-adj';
  const lbl=m.type==='in'?'Ingreso':m.type==='out'?'Salida':'Ajuste';
  return '<div class="it"><div><div class="pname">'+esc(m.name)+'</div><div class="small muted">'+lbl+(m.reason?' · '+esc(m.reason):'')+' · '+fdate(m.date)+'</div></div>'+
    '<div style="text-align:right"><span class="'+cls+'">'+(m.delta>0?'+':'')+fq(m.delta)+'</span><div class="small muted">quedó '+fq(m.after)+'</div></div></div>';
}

  const box=$('#salesBox');if(!box)return;
  const list=filteredSales();
  const ok=list.filter(s=>!s.voided);
  const total=ok.reduce((a,s)=>a+s.total,0),profit=ok.reduce((a,s)=>a+profitOf(s),0);
  const byM={};ok.forEach(s=>s.payments.forEach(p=>{byM[p.methodName]=round2((byM[p.methodName]||0)+p.amount)}));
  let h='<div class="stats" style="margin-bottom:12px"><div class="stat"><div class="v">'+fm(total)+'</div><div class="l">Total vendido</div></div>'+
    '<div class="stat"><div class="v">'+ok.length+'</div><div class="l">Ventas</div></div>'+
    '<div class="stat"><div class="v">'+fm(ok.length?total/ok.length:0)+'</div><div class="l">Ticket promedio</div></div>'+
    '<div class="stat"><div class="v">'+fm(profit)+'</div><div class="l">Ganancia estimada (precio − costo)</div></div></div>';

  if(!list.length){box.innerHTML=h+'<div class="card empty"><h3>No hay ventas en este período</h3><div>Registrá una con “Nueva venta”.</div></div>';return}
  h+='<div class="card" style="padding:6px 10px"><table class="tbl"><thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th>Detalle</th><th>Pago</th><th class="num">Total</th><th></th></tr></thead><tbody>'+
  list.slice(0,300).map(s=>{
    const det=s.items.slice(0,2).map(i=>esc(i.name)+' ×'+fq(i.qty)).join(', ')+(s.items.length>2?' +'+(s.items.length-2)+' más':'');
    return '<tr class="'+(s.voided?'void':'')+'"><td data-label="#" class="keep"><b>#'+s.number+'</b>'+(s.voided?' <span class="badge void">Anulada</span>':'')+'</td><td data-label="Fecha">'+fdate(s.date)+'</td><td data-label="Cliente">'+esc(s.customer||'Mostrador')+'</td><td data-label="Detalle" class="first">'+det+'</td><td data-label="Pago">'+esc(s.payments.map(p=>p.methodName).join(' + '))+'</td><td data-label="Total" class="num"><b>'+fm(s.total)+'</b></td>'+
    '<td class="keep"><div class="acts"><button class="btn sm" data-act="view-sale" data-id="'+s.id+'">Ver</button></div></td></tr>';
  }).join('')+'</tbody></table></div>';

/* ---------- Punto de venta ---------- */
let cart=null;
function defaultMethod(){const m=S.payMethods.find(x=>x.active!==false&&x.type==='cash')||S.payMethods.find(x=>x.active!==false);return m?m.id:''}
function cartTotals(){
  let sub=0;cart.items.forEach(it=>{sub+=it.qty*it.price});sub=round2(sub);
  const disc=round2(Math.min(Math.max(cart.discount||0,0),sub));
  return {sub,disc,total:round2(sub-disc)};
}
function startSale(){ if(!currentSession()) cajaOpenModal(openPOS); else openPOS(); }
function openPOS(){
  cart={items:[],discount:0,pay:[{mid:defaultMethod(),amount:0,auto:true,received:''}],customer:'',note:''};
  $('#modalRoot').innerHTML='<div class="overlay"><div class="modal big" id="pos"><div class="mh"><h3>Nueva venta</h3><button type="button" class="x" data-act="pos-cancel" aria-label="Cerrar">'+ic('x',20)+'</button></div><div class="mb"><div class="posgrid"><div class="posL">'+
    '<div class="search">'+ic('search',18)+'<input id="posq" placeholder="Buscar producto por nombre o código, o escanear el código de barras…" autocomplete="off"></div><div id="posRes"></div><div id="posCart" style="margin-top:12px"></div></div>'+
    '<div class="posR"><div class="fgrid one"><label class="f">Cliente (opcional)<input data-pos="customer" placeholder="Obligatorio si es fiado"></label><label class="f">Nota (opcional)<input data-pos="note"></label></div>'+
    '<div class="tots"><div><span class="muted">Subtotal</span><b id="posSub">$0</b></div><div><span class="muted">Descuento</span><span class="row" style="gap:6px;flex-wrap:nowrap"><button type="button" class="btn sm" data-act="pos-pct" data-p="5">5%</button><button type="button" class="btn sm" data-act="pos-pct" data-p="10">10%</button><input id="posDisc" data-pos="discount" type="text" inputmode="decimal" autocomplete="off" data-num placeholder="$ 0" aria-label="Descuento en pesos"></span></div><div class="grand"><span>Total</span><span id="posTotal">$0</span></div></div>'+
    '<div class="sec" style="margin-top:14px"><h4>Forma de pago</h4><div id="posPay"></div><div id="posPayStatus" class="paystat"></div></div></div></div></div>'+
    '<div class="mf"><button type="button" class="btn ghost" data-act="pos-cancel">Cancelar</button><button type="button" class="btn primary" data-act="pos-confirm">'+ic('check',17)+'Confirmar venta</button></div></div></div>';
  renderCart();renderPay();updateTotals();
  setTimeout(()=>{const q=$('#posq');if(q)q.focus()},30);
}
function renderRes(){
  const q=norm($('#posq').value),box=$('#posRes');
  if(!q){box.innerHTML='';return}
  const list=S.products.filter(p=>p.active!==false&&q.split(' ').every(w=>norm([p.name,p.sku,p.brand,p.location].join(' ')).indexOf(w)>-1)).slice(0,8);
  box.innerHTML=list.length?'<div class="res">'+list.map(p=>'<div class="rrow" data-act="pos-add" data-id="'+p.id+'">'+thumb(p,36)+'<div class="grow"><div class="pname">'+esc(p.name)+'</div><div class="small muted">'+esc(p.sku)+' · stock '+fstock(p)+'</div></div>'+(isPack(p)?'<button type="button" class="btn sm" data-act="pos-add" data-id="'+p.id+'" data-loose="1" title="Vender por unidad suelta">Suelto '+fm(unitPrice(p))+'</button> ':'')+'<b>'+(p.price?fm(p.price):'sin precio')+'</b></div>').join('')+'</div>':'<div class="small muted" style="margin-top:6px">Sin resultados.</div>';
}
function posAdd(id,loose){
  const p=prod(id);if(!p||!cart)return;
  loose=!!loose&&isPack(p);
  const ex=cart.items.find(i=>i.pid===id&&!!i.loose===loose);
  const pr=loose?unitPrice(p):(p.price||0);
  if(ex)ex.qty=round2(ex.qty+1);else cart.items.push({pid:id,qty:1,price:pr,loose});
  if(!pr)toast('“'+p.name+'” no tiene precio cargado: completalo en la venta','warn');
  const q=$('#posq');q.value='';$('#posRes').innerHTML='';q.focus();
  renderCart();updateTotals();
}
function renderCart(){
  const box=$('#posCart');if(!box)return;
  if(!cart.items.length){box.innerHTML='<div class="empty small" style="padding:18px">Buscá y agregá productos a la venta.</div>';return}
  box.innerHTML='<table class="tbl"><thead><tr><th>Producto</th><th>Cant.</th><th>Precio unit.</th><th class="num">Subtotal</th><th></th></tr></thead><tbody>'+
  cart.items.map((it,i)=>{const p=prod(it.pid);const low=cartNeed(p.id)>p.stock+1e-9;
    return '<tr><td class="first"><div class="pcell">'+thumb(p,36)+'<div><div class="pname">'+esc(p.name)+'</div><div class="small '+(low?'neg':'muted')+'">'+stockHint(p,it,low)+'</div>'+
    (isPack(p)?'<select class="cartmode" data-pos="mode" data-i="'+i+'" aria-label="Vender por"><option value="pack"'+(it.loose?'':' selected')+'>Por '+esc(p.unit)+' ('+fq(p.packQty)+' u.)</option><option value="u"'+(it.loose?' selected':'')+'>Suelto (por unidad)</option></select>':'')+
    '</div></div></td>'+
    '<td data-label="Cant."><input class="cartq" data-pos="qty" data-i="'+i+'" type="text" inputmode="decimal" autocomplete="off" data-num value="'+inNum(it.qty)+'"></td>'+
    '<td data-label="Precio"><input class="cartp" data-pos="price" data-i="'+i+'" type="text" inputmode="decimal" autocomplete="off" data-num value="'+inNum(it.price)+'"></td>'+
    '<td data-label="Subtotal" class="num"><b id="posLine'+i+'">'+fm(it.qty*it.price)+'</b></td>'+
    '<td><button type="button" class="btn sm icon danger" data-act="pos-rm" data-i="'+i+'" aria-label="Quitar producto">'+ic('x',15)+'</button></td></tr>';
  }).join('')+'</tbody></table>';
}
// lo que se lleva de cada producto, en la unidad del stock (sumando cajas y sueltos)
function cartNeed(pid){const p=prod(pid);return cart.items.filter(i=>i.pid===pid).reduce((a,i)=>a+(i.loose&&isPack(p)?i.qty/p.packQty:i.qty),0)}
function stockHint(p,it,low){return 'Stock: '+fstock(p)+(it.loose?' · hay '+fq(Math.floor(p.stock*p.packQty+1e-7))+' u.':'')+(low?' · ¡no alcanza!':'')}
function renderPay(){
  const box=$('#posPay');if(!box)return;
  const act=S.payMethods.filter(m=>m.active!==false);
  box.innerHTML=cart.pay.map((p,i)=>{
    const m=pmObj(p.mid);
    return '<div class="payrow"><label class="f">Forma<select data-pos="paymethod" data-i="'+i+'">'+options(act.concat(m&&m.active===false?[m]:[]),p.mid)+'</select></label>'+
    '<label class="f">Monto<input data-pos="payamt" data-i="'+i+'" type="text" inputmode="decimal" autocomplete="off" data-num value="'+inNum((p.amount||''))+'"></label>'+
    (m&&m.type==='cash'?'<label class="f">Recibe (opcional)<input data-pos="payrec" data-i="'+i+'" type="text" inputmode="decimal" autocomplete="off" data-num value="'+inNum((p.received||''))+'"></label>':'<div></div>')+
    (cart.pay.length>1?'<button type="button" class="btn sm icon danger" data-act="pos-rmpay" data-i="'+i+'" aria-label="Quitar forma de pago">'+ic('x',15)+'</button>':'<div></div>')+'</div>'+
    (m&&m.type==='credit'?'<div class="small neg" style="margin:-4px 0 8px">Cuenta corriente: completá el nombre del cliente. Queda en Liquidaciones como pendiente de cobro.</div>':'');
  }).join('')+'<button type="button" class="btn sm" data-act="pos-addpay">+ Dividir el pago en otra forma</button>';
}
function updateTotals(){
  if(!cart||!$('#posTotal'))return;
  const t=cartTotals();
  $('#posSub').textContent=fm(t.sub);$('#posTotal').textContent=fm(t.total);
  cart.items.forEach((it,i)=>{const el=$('#posLine'+i);if(el)el.textContent=fm(it.qty*it.price)});
  if(cart.pay.length===1&&cart.pay[0].auto){
    cart.pay[0].amount=t.total;const inp=$('[data-pos="payamt"][data-i="0"]');if(inp)inp.value=t.total?inNum(t.total):'';
  }
  updatePayStatus(t);
}
function updatePayStatus(t){
  t=t||cartTotals();
  const paid=round2(cart.pay.reduce((a,p)=>a+(p.amount||0),0)),diff=round2(t.total-paid);
  const el=$('#posPayStatus');if(!el)return;
  let msg,cls;
  if(diff>0.009){msg='Falta cobrar '+fm(diff);cls='color:var(--amber)'}
  else if(diff<-0.009){msg='Los pagos se pasan por '+fm(-diff);cls='color:var(--red)'}
  else{msg='✓ Los pagos cubren el total';cls='color:var(--green)'}
  if(cart.pay.length===1){const p=cart.pay[0],m=pmObj(p.mid);const rec=num(p.received);if(m&&m.type==='cash'&&rec>p.amount&&p.amount>0)msg+='  ·  Vuelto: '+fm(rec-p.amount)}
  el.setAttribute('style',cls);el.textContent=msg;
}
function posInput(t){
  if(!cart)return;
  const k=t.getAttribute('data-pos'),i=parseInt(t.getAttribute('data-i'),10);
  if(k==='mode'){
    const it=cart.items[i],p=prod(it.pid);it.loose=t.value==='u'&&isPack(p);it.price=it.loose?unitPrice(p):(p.price||0);
    renderCart();updateTotals();return;
  }
  if(k==='qty'){cart.items[i].qty=num(t.value)}
  else if(k==='price'){cart.items[i].price=num(t.value)}
  else if(k==='discount'){cart.discount=num(t.value)}
  else if(k==='customer'){cart.customer=t.value}
  else if(k==='note'){cart.note=t.value}
  else if(k==='payamt'){
    cart.pay[i].amount=num(t.value);cart.pay[i].auto=false;
    if(cart.pay.length===2){ // con dos formas de pago, la otra se completa sola con el resto
      const j=1-i,rest=Math.max(0,round2(cartTotals().total-cart.pay[i].amount));
      cart.pay[j].amount=rest;cart.pay[j].auto=false;
      const o=$('[data-pos="payamt"][data-i="'+j+'"]');if(o)o.value=rest?inNum(rest):'';
    }
  }
  else if(k==='payrec'){cart.pay[i].received=t.value}
  updateTotals();
  if(k==='qty'){ // actualizar aviso de stock
    const p=prod(cart.items[i].pid);
    if(p)cart.items.forEach((it,j)=>{if(it.pid!==p.id)return;const inp=$('[data-pos="qty"][data-i="'+j+'"]'),row=inp&&inp.closest('tr'),d=row&&row.querySelector('.small');
      if(d){const low=cartNeed(p.id)>p.stock+1e-9;d.className='small '+(low?'neg':'muted');d.innerHTML=stockHint(p,it,low)}});
  }
}
let posBusy=false;
async function posConfirm(){
  if(!cart||posBusy)return;
  if(!cart.items.length){toast('Agregá al menos un producto','err');return}
  if(cart.items.some(i=>!(i.qty>0))){toast('Revisá las cantidades','err');return}
  const t=cartTotals();
  if(t.total<=0&&!confirm('El total es $0. ¿Registrar igual?'))return;
  const paid=round2(cart.pay.reduce((a,p)=>a+(p.amount||0),0));
  if(Math.abs(paid-t.total)>0.009){toast('Los pagos ('+fm(paid)+') no coinciden con el total ('+fm(t.total)+')','err');return}
  const hasCredit=cart.pay.some(p=>p.amount>0&&(pmObj(p.mid)||{}).type==='credit');
  if(hasCredit&&!cart.customer.trim()){toast('Para vender en cuenta corriente, completá el nombre del cliente','err');return}
  const short=[...new Set(cart.items.map(i=>i.pid))].filter(id=>cartNeed(id)>prod(id).stock+1e-9).map(id=>({pid:id}));
  if(short.length&&!confirm('No alcanza el stock de: '+short.map(i=>prod(i.pid).name).join(', ')+'.\n¿Vender igual? El stock quedará en 0.'))return;
  posBusy=true;
  const btn=$('[data-act="pos-confirm"]');if(btn){btn.disabled=true;btn.dataset.lbl=btn.textContent;btn.textContent='Guardando…'}
  let sale=null;
  try{sale=await createSale(cart)}finally{posBusy=false}
  if(!sale){const b=$('[data-act="pos-confirm"]');if(b){b.disabled=false;b.textContent=b.dataset.lbl||'Cobrar'}return}
  cart=null;closeModal();render();
  toast('Venta #'+sale.number+' registrada · '+fm(sale.total));
}

function settleModal(id){
  const x=S.settlements.find(s=>s.id===id);if(!x||x.status!=='pending')return;
  if(x.kind==='credit'){
    const methods=S.payMethods.filter(m=>m.active!==false&&m.type!=='credit');
    openModal('Cobrar cuenta corriente',
      '<p>Venta <b>#'+x.saleNumber+'</b> · '+esc(x.customer||'Sin nombre')+' · Debe <b>'+fm(x.gross)+'</b></p><div class="fgrid"><label class="f">Monto cobrado<input name="amount" type="text" inputmode="decimal" autocomplete="off" data-num required value="'+inNum(x.gross)+'"></label><label class="f">¿Cómo pagó?<select name="mid">'+options(methods,defaultMethod())+'</select></label></div><p class="muted small">Si paga en efectivo, se suma como ingreso en la caja abierta.</p>',
      async fd=>{
        const a=round2(num(fd.amount));if(a<=0){toast('Ingresá el monto cobrado','err');return false}
        const m=pmObj(fd.mid);
        let sess=null;
        if(m&&m.type==='cash'){
          sess=currentSession();if(!sess){toast('Abrí la caja para registrar un cobro en efectivo','err');return false}
        }
        const r=await attempt(()=>sb.from('settlements').update({status:'settled',settled_date:ymd(new Date()),received:a,collected_via:m?m.name:''}).eq('id',x.id).eq('status','pending').select());
        if(r.ok&&(!r.data||!r.data.length)){toast('Esa cuenta ya fue cobrada por otra persona.','err');await safeReload(['settlements']);return false}
        if(!r.ok){await safeReload(['settlements']);return false}
        if(sess){
          const c=await attempt(()=>sb.rpc('add_cash_move',{p_session:sess.id,p_type:'in',p_amount:a,p_concept:'Cobro cuenta corriente',p_note:(x.customer||'')+' · venta #'+x.saleNumber}));
          if(!c.ok){ // deshace el cobro para que no quede registrado sin entrar a la caja
            await attempt(()=>sb.from('settlements').update({status:'pending',settled_date:null,received:null,collected_via:null}).eq('id',x.id));
            await safeReload(['settlements','cash_sessions']);return false;
          }
        }
        await safeReload(['settlements','cash_sessions']);
        toast('Cobro registrado');
      },'Registrar cobro');
  } else {
    openModal('Acreditar liquidación',
      '<p>Venta <b>#'+x.saleNumber+'</b> · '+esc(x.methodName)+'. Bruto '+fm(x.gross)+(x.fee?' · comisión −'+fm(x.fee):'')+'.</p><div class="fgrid"><label class="f">Monto que te acreditaron<input name="amount" type="text" inputmode="decimal" autocomplete="off" data-num required value="'+inNum(x.net)+'"></label><label class="f">Fecha de acreditación<input name="date" type="date" required value="'+ymd(new Date())+'"></label></div><p class="muted small">Si el banco o Mercado Pago acreditó un monto distinto, escribí el monto real: la diferencia queda como comisión.</p>',
      async fd=>{
        const a=round2(num(fd.amount));
        const upd={status:'settled',settled_date:fd.date||ymd(new Date()),received:a};
        if(a!==x.net){upd.fee=round2(x.gross-a);upd.net=a}
        const r=await attempt(()=>sb.from('settlements').update(upd).eq('id',x.id).eq('status','pending').select());
        await safeReload(['settlements']);
        if(!r.ok)return false;
        if(!r.data||!r.data.length){toast('Esa liquidación ya fue acreditada por otra persona.','err');return false}
        toast('Liquidación acreditada');
      },'Acreditar');
  }
}
async function settleBulk(){
  const ids=Object.keys(ui.sel).filter(k=>ui.sel[k]);
  const items=S.settlements.filter(x=>ids.indexOf(x.id)>-1&&x.status==='pending'&&x.kind==='electronic');
  if(!items.length){toast('Seleccioná liquidaciones pendientes con las casillas','err');return}
  if(!confirm('¿Marcar '+items.length+' liquidación(es) como acreditadas por '+fm(items.reduce((a,x)=>a+x.net,0))+' (neto)?'))return;
  const day=ymd(new Date());
  const r=await attempt(async()=>{
    for(let i=0;i<items.length;i+=10){
      const res=await Promise.all(items.slice(i,i+10).map(x=>sb.from('settlements').update({status:'settled',settled_date:day,received:x.net}).eq('id',x.id).eq('status','pending')));
      res.forEach(q=>{if(q.error)throw q.error});
    }
  });
  await safeReload(['settlements']);
  if(!r.ok)return;
  ui.sel={};render();toast(items.length+' liquidación(es) acreditadas');
}

      const others=S.payMethods.filter(x=>(!m||x.id!==m.id)&&x.type==='cash'&&x.active!==false);
      if(!others.length&&!(data.type==='cash'&&data.active)){toast('Tiene que quedar al menos una forma de pago en efectivo activa','err');return false}
      const r=await attempt(()=>sb.from('pay_methods').upsert(Object.assign({id:m?m.id:uid()},data)),'Ya existe una forma de pago con ese nombre');
      await safeReload(['pay_methods']);
      if(!r.ok)return false;
      toast('Forma de pago guardada');

async function pmDel(id){
  const m=pmObj(id);if(!m)return;
  const others=S.payMethods.filter(x=>x.id!==id&&x.type==='cash'&&x.active!==false);
  if(m.type==='cash'&&!others.length){toast('No podés eliminar la única forma de pago en efectivo','err');return}
  const used=S.sales.some(s=>s.payments.some(p=>p.methodId===id))||S.settlements.some(x=>x.methodId===id);
  if(used){
    if(!confirm('"'+m.name+'" ya se usó en ventas. Se va a desactivar (el historial se conserva). ¿Continuar?'))return;
    await attempt(()=>sb.from('pay_methods').update({active:false}).eq('id',id));
  } else {
    if(!confirm('¿Eliminar la forma de pago "'+m.name+'"?'))return;
    await attempt(()=>sb.from('pay_methods').delete().eq('id',id));
  }
  await safeReload(['pay_methods']);render();
}

function filteredProducts(){
  const q=norm(ui.q);
  const r=S.products.filter(p=>{
    if(ui.cat&&p.categoryId!==ui.cat) return false;
    if(ui.sup&&p.supplierId!==ui.sup) return false;
    const s=status(p);
    if(ui.st==='need'&&!(s==='low'||s==='out')) return false;
    if(ui.st==='review'&&!p.review) return false;
    if(ui.st&&ui.st!=='need'&&ui.st!=='review'&&s!==ui.st) return false;
    if(q){
      const hay=norm([p.name,p.sku,p.brand,p.location,catName(p.categoryId),supName(p.supplierId)].join(' '));
      return q.split(' ').every(w=>hay.indexOf(w)>-1);
    }
    return true;
  });
  r.sort((a,b)=>{
    if(ui.sort==='stock') return a.stock-b.stock;
    if(ui.sort==='cat') return catName(a.categoryId).localeCompare(catName(b.categoryId))||a.name.localeCompare(b.name);
    if(ui.sort==='loc') return (a.location||'zzz').localeCompare(b.location||'zzz')||a.name.localeCompare(b.name);
    return a.name.localeCompare(b.name,'es');
  });
  return r;
}

  const p=prod(id);if(!p)return;
  const sup=supObj(p.supplierId);
  const margin=p.cost>0&&p.price>0?Math.round((p.price-p.cost)/p.price*100):null;
  const lines=saleLines(id);
  const units=lines.reduce((a,l)=>a+iq(l.it),0),rev=lines.reduce((a,l)=>a+l.it.qty*l.it.price,0),gain=lines.reduce((a,l)=>a+l.it.qty*(l.it.price-l.it.cost),0);
  const since=startOfDay(addDays(new Date(),-29));
  const u30=lines.filter(l=>new Date(l.sale.date)>=since).reduce((a,l)=>a+iq(l.it),0);
  const links=[];
  const bu=safeUrl(p.buyUrl);if(bu)links.push('<a class="btn sm" href="'+esc(bu)+'" target="_blank" rel="noopener">'+ic('link',15)+'Ver este producto en el proveedor</a>');
  const su=sup?safeUrl(sup.url):'';if(su)links.push('<a class="btn sm" href="'+esc(su)+'" target="_blank" rel="noopener">'+ic('globe',15)+'Sitio de '+esc(sup.name)+'</a>');
  if(sup&&sup.phone)links.push('<a class="btn sm" href="https://wa.me/'+waNum(sup.phone)+'" target="_blank" rel="noopener">'+ic('chat',15)+'WhatsApp '+esc(sup.name)+'</a>');
  let h='<div class="photo-row">'+thumb(p,96)+'<div class="grow"><div class="pname" style="font-size:18px">'+esc(p.name)+'</div><div class="sku">'+esc(p.sku)+(p.brand?' · '+esc(p.brand):'')+'</div><div style="margin-top:6px"><span class="tag">'+esc(catName(p.categoryId))+'</span> '+badge(p)+'</div></div></div>'+
  (p.review?'<div class="banner" style="margin:14px 0 0"><div><b>Para revisar:</b> '+esc(p.review)+'</div></div>':'')+'<div class="kv"><div><span>Stock actual</span><b>'+fstock(p)+'</b></div><div><span>Mínimo / ideal</span><b>'+fq(p.min)+' / '+(p.ideal?fq(p.ideal):'—')+'</b></div><div><span>Precio de venta'+(isPack(p)?' ('+esc(p.unit)+')':'')+'</span><b>'+(p.price?fm(p.price):'—')+'</b></div>'+(isPack(p)?'<div><span>Precio suelto (por unidad)</span><b>'+fm(unitPrice(p))+'</b></div><div><span>Unidades por '+esc(p.unit)+'</span><b>'+fq(p.packQty)+'</b></div>':'')+'<div><span>Costo</span><b>'+(p.cost?fm(p.cost):'—')+'</b></div><div><span>Margen</span><b>'+(margin!==null?margin+'%':'—')+'</b></div><div><span>Ubicación</span><b style="font-size:15px">'+esc(p.location||'—')+'</b></div></div>'+
  '<div class="sec"><h4>Proveedor habitual</h4>'+(sup?'<div><b>'+esc(sup.name)+'</b>'+(sup.phone?' · '+esc(sup.phone):'')+'</div>':'<div class="muted">Sin proveedor asignado.</div>')+(links.length?'<div class="row" style="margin-top:8px">'+links.join('')+'</div>':'')+'</div>'+
  (p.notes?'<div class="sec"><h4>Notas</h4>'+esc(p.notes)+'</div>':'')+
  '<div class="row sec noprint"><button class="btn" data-act="edit-product" data-id="'+p.id+'">'+ic('edit',16)+'Editar</button><button class="btn" data-act="move" data-id="'+p.id+'" data-type="in">+ Ingreso</button><button class="btn" data-act="move" data-id="'+p.id+'" data-type="out">− Salida</button></div>'+
  '<div class="sec"><h4>Historial de ventas</h4><div class="kv"><div><span>Unidades vendidas (total)</span><b>'+fq(units)+'</b></div><div><span>Últimos 30 días</span><b>'+fq(u30)+'</b></div><div><span>Facturado</span><b>'+fm(rev)+'</b></div><div><span>Ganancia estimada</span><b>'+fm(gain)+'</b></div></div>'+
  (lines.length?'<table class="tbl"><thead><tr><th>Fecha</th><th>Venta</th><th>Cliente</th><th class="num">Cant.</th><th class="num">Precio</th><th class="num">Subtotal</th></tr></thead><tbody>'+lines.slice(0,15).map(l=>'<tr><td data-label="Fecha">'+fdate(l.sale.date)+'</td><td data-label="Venta"><span class="linkish" data-act="view-sale" data-id="'+l.sale.id+'">#'+l.sale.number+'</span></td><td data-label="Cliente">'+esc(l.sale.customer||'Mostrador')+'</td><td data-label="Cant." class="num">'+fq(l.it.qty)+'</td><td data-label="Precio" class="num">'+fm(l.it.price)+'</td><td data-label="Subtotal" class="num">'+fm(l.it.qty*l.it.price)+'</td></tr>').join('')+'</tbody></table>'+(lines.length>15?'<div class="small muted">Mostrando las últimas 15 de '+lines.length+' ventas.</div>':''):'<div class="muted small">Todavía no se vendió este producto.</div>')+'</div>';

  openSheet('Ficha del producto',h);
}

/* ---------- Faltantes ---------- */
function orderText(list,sup){
  let t='Hola'+(sup&&sup.name?' '+sup.name:'')+', necesito hacer el siguiente pedido para '+storeName()+':\n';
  list.forEach(p=>{t+='- '+p.name+(p.brand?' ('+p.brand+')':'')+': '+fq(suggested(p))+' '+p.unit+'\n'});
  return t+'Gracias!';
}
function viewFaltantes(){
  const need=needs();
  let h='<div class="gh pagehead"><div class="title" style="margin:0">Lista de faltantes</div><div class="row noprint"><button class="btn" data-act="print">'+ic('print',16)+'Imprimir</button></div></div>';
  if(!need.length) return h+'<div class="card empty"><h3>No falta nada</h3><div>Todos los productos activos están por encima de su mínimo.</div></div>';
  const groups={};
  need.forEach(p=>{const k=p.supplierId&&supObj(p.supplierId)?p.supplierId:'_';(groups[k]=groups[k]||[]).push(p)});
  let total=0;
  const keys=Object.keys(groups).sort((a,b)=>a==='_'?1:b==='_'?-1:supName(a).localeCompare(supName(b)));
  keys.forEach(k=>{
    const list=groups[k].sort((a,b)=>a.name.localeCompare(b.name,'es'));
    const sup=k==='_'?null:supObj(k);
    const sub=list.reduce((a,p)=>a+suggested(p)*(p.cost||0),0);total+=sub;
    const su=sup?safeUrl(sup.url):'';
    h+='<div class="card" style="margin-bottom:14px"><div class="gh"><div><div class="h3" style="margin:0">'+(sup?esc(sup.name):'Sin proveedor asignado')+'</div>'+(sup&&sup.phone?'<div class="small muted">'+esc(sup.phone)+'</div>':'')+'</div>'+
      '<div class="row noprint"><button class="btn sm" data-act="copy-order" data-k="'+k+'">Copiar pedido</button>'+
      (su?'<a class="btn sm" target="_blank" rel="noopener" href="'+esc(su)+'">'+ic('globe',15)+'Ir al sitio</a>':'')+
      (sup&&sup.phone?'<a class="btn sm primary" target="_blank" rel="noopener" href="https://wa.me/'+waNum(sup.phone)+'?text='+encodeURIComponent(orderText(list,sup))+'">Enviar por WhatsApp</a>':'')+'</div></div>'+
      '<table class="tbl"><thead><tr><th>Producto</th><th class="num">Stock</th><th class="num">Mínimo</th><th class="num">Sugerido pedir</th><th class="num">Costo est.</th><th class="noprint"></th></tr></thead><tbody>'+
      list.map(p=>{
        const bu=safeUrl(p.buyUrl);
        return '<tr><td class="first"><div class="pcell">'+thumb(p,36)+'<div><div class="pname">'+esc(p.name)+'</div><div class="sku">'+esc(catName(p.categoryId))+(p.sku?' · '+esc(p.sku):'')+'</div></div></div></td>'+
        '<td data-label="Stock" class="num">'+badge(p)+' <b>'+fq(p.stock)+'</b></td><td data-label="Mínimo" class="num">'+fq(p.min)+'</td>'+
        '<td data-label="Sugerido pedir" class="num"><b>'+fq(suggested(p))+'</b> '+esc(p.unit)+'</td><td data-label="Costo est." class="num">'+(p.cost?fm(suggested(p)*p.cost):'—')+'</td>'+
        '<td class="noprint"><div class="acts">'+(bu?'<a class="btn sm" href="'+esc(bu)+'" target="_blank" rel="noopener" title="Ver en el proveedor" aria-label="Ver en el proveedor">'+ic('link',15)+'</a>':'')+'<button class="btn sm" data-act="move" data-id="'+p.id+'" data-type="in" data-qty="'+suggested(p)+'">Registrar ingreso</button></div></td></tr>';
      }).join('')+'</tbody></table><div class="small" style="text-align:right;padding:8px 10px">Subtotal estimado: <b>'+fm(sub)+'</b></div></div>';
  });
  return h+'<div class="card" style="text-align:right">Total estimado de reposición: <b style="font-size:18px">'+fm(total)+'</b></div>';
}

async function loadAdmin(){
  if(ME.admin){
    try{
      const a=await sbClient().from('profiles').select('*').order('email');
      const b=await sbClient().from('memberships').select('*');
      if(a.error)throw a.error;if(b.error)throw b.error;
      ADM={users:a.data||[],mem:b.data||[]};
    }catch(e){ADM={users:[],mem:[],err:errMsg(e)}}
  } else ADM={users:[],mem:[]};
  await loadTeam();
  if(ui.tab==='usuarios')render();
}
async function loadTeam(){
  TEAM=null;

  try{
    const r=await sbClient().rpc('list_store_members',{p_store:STORE});

    TEAM={store:STORE,list:r.data||[]};

/* ================= Modales ================= */
function openModal(title,body,onSubmit,okLabel){
  $('#modalRoot').innerHTML='<div class="overlay" data-act="overlay"><form class="modal" id="mform" autocomplete="off"><div class="mh"><h3>'+esc(title)+'</h3><button type="button" class="x" data-act="close" aria-label="Cerrar">'+ic('x',20)+'</button></div><div class="mb">'+body+'</div><div class="mf"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn primary">'+esc(okLabel||'Guardar')+'</button></div></form></div>';
  const form=$('#mform');let busy=false;
  form.addEventListener('submit',async e=>{
    e.preventDefault();if(busy)return;
    const badN=[...form.querySelectorAll('[data-num]')].find(x=>x.value.trim()!==''&&isNaN(parseNum(x.value)));
    if(badN){const l=badN.closest('label');toast('Revisá el número en “'+(l?l.childNodes[0].textContent.trim():'el campo')+'”: escribilo como 1234,56 o 1234.56','err');badN.focus();return}
    const fd={};new FormData(form).forEach((v,k)=>{fd[k]=v});
    const btn=form.querySelector('.mf .btn.primary'),lab=btn.textContent;
    busy=true;btn.disabled=true;btn.textContent='Guardando…';
    let r;
    try{r=await onSubmit(fd)}catch(err){toast(errMsg(err),'err');r=false}
    busy=false;
    if(r===false){if(document.body.contains(btn)){btn.disabled=false;btn.textContent=lab}return}
    closeModal();render();
  });
  const f=$('#mform input:not([type=hidden]):not([type=file]),#mform select');if(f)setTimeout(()=>f.focus(),30);
}
function openSheet(title,body){
  $('#modalRoot').innerHTML='<div class="overlay" data-act="overlay"><div class="modal big"><div class="mh"><h3>'+esc(title)+'</h3><button type="button" class="x" data-act="close" aria-label="Cerrar">'+ic('x',20)+'</button></div><div class="mb">'+body+'</div></div></div>';
}

async function applyFormPhoto(p){

  if(!formPhoto||!formPhoto.changed)return null;
  const old=p.photoPath||null;

  p.brand=(fd.brand||'').trim();p.categoryId=fd.categoryId||'';p.supplierId=fd.supplierId||'';
  p.buyUrl=(fd.buyUrl||'').trim();
  p.location=(fd.location||'').trim();p.unit=fd.unit||'unidad';
  p.min=num(fd.min);p.ideal=num(fd.ideal);

function csvCell(v,d){v=String(v==null?'':v);return (v.indexOf(d)>-1||v.indexOf('"')>-1||v.indexOf('\n')>-1)?'"'+v.replace(/"/g,'""')+'"':v}
function csvNum(n){return String(n==null?'':n).replace('.',',')}
const CSV_HEAD=['codigo','nombre','categoria','proveedor','marca','ubicacion','unidad','stock','minimo','ideal','costo','precio','activo','unidades_por_caja','precio_unidad'];

  });

function templateCSV(){

  const rows=[CSV_HEAD.join(d),['JR-0001','Codo PPR 20mm 90°','Plomería','Distribuidora Norte','Tigre','Estante B2','unidad','35','20','80','350','700','si'].join(d),['','Esmalte sintético 1L Blanco','Pinturas y solventes','','Colorin','Estante C1','unidad','6','6','12','9000','14500','si'].join(d),['','Tornillo autoperforante 8x1/2 (caja x1000)','Tornillería','','','Estante D1','caja','3','1','5','12000','18500','si','1000','25'].join(d)];
  download('plantilla-inventario.csv','﻿'+rows.join('\r\n'),'text/csv;charset=utf-8');
